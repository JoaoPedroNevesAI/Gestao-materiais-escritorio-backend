name: CI Backend

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ifescritorio

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ifescritorio/pom.xml

      - name: Verificar Java
        run: java -version

      - name: Executar testes e build
        run: mvn --batch-mode clean verify
